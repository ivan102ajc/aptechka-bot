nt="date"] .day-mark{outline:2px solid #487958;outline-offset:2px}.history{display:grid;gap:0;margin-top:10px}.history-row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:11px 0;align-items:center;color:var(--sub);font-size:.9rem}.empty{margin-top:9px;color:var(--sub);line-height:1.5}.game-panel{width:min(100%,640px);margin:10px auto 0;padding:clamp(16px,4vw,30px)}.game-panel h2{font-size:clamp(1.35rem,4vw,2rem);margin:9px 0 13px}.game-panel p{line-height:1.5;color:var(--sub);margin-bottom:12px}.answers{display:grid;gap:8px}.choice{padding:11px 12px;border-radius:12px;border:1px solid #d5e2d3;background:#f8faf5;text-align:left;min-height:45px;font-weight:650;line-height:1.3}.choice:hover:not(:disabled){background:#edf4e8}.choice[data-result="correct"]{background:#e2f0d0;border-color:#83aa76;color:#244a2d}.choice[data-result="wrong"]{background:#f7e6df;border-color:#be8b74;color:#773e2e}.feedback{margin:13px 0;padding:11px 13px;background:#edf3e7;border-radius:11px;line-height:1.45}.game-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tile{display:grid;place-content:center;min-height:84px;border:1px solid #d6e2d2;border-radius:13px;background:#f2f7ec;text-align:center;font-size:.84rem;padding:6px;font-weight:700}.tile:hover:not(:disabled),.tile[aria-pressed="true"]{border-color:#5d8e62;background:#e3efda}.tile[data-matched="true"]{background:#dff0c8;color:#254c32}.tile span{font-size:1.35rem}.routine{display:grid;gap:6px;margin:12px 0;padding-left:24px;color:var(--green);font-weight:700}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

<body>
<header class="top"><div class="wrap">
<div class="brand"><span class="logo" aria-hidden="true">+</span>Моя аптечка</div>
<nav class="tabs" aria-label="Разделы">
<button class="tab" data-action="nav" data-value="home"><span class="tab-icon" aria-hidden="true">⌂</span>Сегодня</button>
<button class="tab" data-action="nav" data-value="games"><span class="tab-icon" aria-hidden="true">◇</span>Игры</button>
<button class="tab" data-action="nav" data-value="progress"><span class="tab-icon" aria-hidden="true">▥</span>Прогресс</button>
</nav>
<div class="points" aria-label="Очки заботы"><span aria-hidden="true">✦</span><span id="points">0 очков</span></div>
</div></header>
<main class="wrap page" id="page"></main>
<div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
<script>
'use strict';
const habits = [
  {id:'water', icon:'💧', color:'sky', name:'Сделать паузу на воду'},
  {id:'move', icon:'👟', color:'mint', name:'Пройтись или немного размяться'},
  {id:'rest', icon:'🌿', color:'peach', name:'Выделить время на отдых'},
  {id:'sleep', icon:'🌙', color:'lilac', name:'Выбрать время отхода ко сну'},
];
const moods = [['😔','Тяжело'],['🙁','Не очень'],['😐','Нормально'],['🙂','Хорошо'],['😄','Отлично']];
const games = {
  quiz:{name:'Миф или факт', icon:'?', color:'lilac', type:'Викторина', time:'2 мин', desc:'Проверь, что ты знаешь о здоровых привычках.'},
  pairs:{name:'Пары привычек', icon:'✿', color:'mint', type:'Найди пары', time:'2 мин', desc:'Соедини привычку с подходящим действием.'},
  routine:{name:'День по порядку', icon:'☀', color:'peach', type:'Последовательность', time:'1 мин', desc:'Собери распорядок дня из четырёх шагов.'},
};
const questions = [
  ['Короткая прогулка тоже считается движением.', 0, 'Да. Движение можно распределять на короткие промежутки в течение дня.'],
  ['Привычку легче попробовать, если привязать её к знакомому действию.', 0, 'Например, можно налить себе стакан воды после завтрака.'],
  ['Если пропустить день, вся работа над привычкой пропадает.', 1, 'Пропуск бывает у всех. Можно просто продолжить со следующего небольшого шага.'],
  ['Подготовить вещи для прогулки заранее может помочь выйти из дома.', 0, 'Когда всё под рукой, начать задуманное проще.'],
  ['Время для отдыха можно планировать заранее.', 0, 'Небольшую паузу можно добавить в календарь так же, как любую встречу.'],
];
const pairs = [
  [['💧','Вода'],['🥤','Налить стакан']],
  [['👟','Движение'],['🚶','Немного пройтись']],
  [['🌙','Сон'],['📵','Убрать телефон перед сном']],
  [['🌿','Отдых'],['🪟','Сделать паузу']],
  [['🥗','Обед'],['🍽️','Выделить время на еду']],
  [['🧘','Разминка'],['🙆','Мягко потянуться']],
];
const routines = [
  ['Потянуться после пробуждения','Отойти от дел на обед','Прогуляться после работы или учёбы','Выключить экран перед сном'],
  ['Позавтракать после подъёма','Сделать короткую паузу перед обедом','Выйти на прогулку после ужина','Приглушить свет перед сном'],
  ['Открыть шторы после пробуждения','Размяться перед обедом','Подготовить одежду на завтра вечером','Убрать телефон перед сном'],
];
const activeTelegram = () => window.Telegram?.WebApp;
const storageKey = 'my-aptechka:wellbeing:v1';
const page = document.querySelector('#page');
const announcement = document.querySelector('#announcement');
const dateFormat = new Intl.DateTimeFormat('ru', {day:'numeric',month:'long'});
const weekdayFormat = new Intl.DateTimeFormat('ru', {weekday:'short'});
const dayMs = 86400000;
const localKey = (date = new Date()) => [date.getFullYear(), date.getMonth() + 1, date.getDate()].map((part,index) => String(part).padStart(index ? 2 : 4,'0')).join('-');
const shiftedDate = (offset, base = new Date()) => {const date = new Date(base); date.setDate(date.getDate() + offset); return date;};
const ordinal = date => Math.floor(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())/dayMs);
const word = (n, forms) => forms[n % 100 >= 11 && n % 100 <= 14 ? 2 : n % 10 === 1 ? 0 : n % 10 >= 2 && n % 10 <= 4 ? 1 : 2];
const validMood = mood => Number.isInteger(mood) && mood >= 0 && mood < moods.length;
const emptyDay = () => ({habits:[], games:[], mood:null});
function loadDays(){
  try {
    const raw = JSON.parse(localStorage.getItem(storageKey) || '{}');
    return Object.fromEntries(Object.entries(raw).filter(([key,day]) => /^\d{4}-\d{2}-\d{2}$/.test(key) && day && typeof day === 'object').map(([key,day]) => [key,{
      habits:habits.map(habit => habit.id).filter(id => Array.isArray(day.habits) && day.habits.includes(id)),
      games:Object.keys(games).filter(id => Array.isArray(day.games) && day.games.includes(id)),
      mood:validMood(day.mood) ? day.mood : null,
    }]));
  } catch {return {};}
}
let days = loadDays();
let today = localKey();
let screen = 'home';
let run = null;
let pairTimer;
let telegramReady = false;
const selectedDay = () => days[today] || emptyDay();
const totalPoints = () => Object.values(days).reduce((sum,day) => sum + 5 * day.habits.length + 10 * day.games.length,0);
const hasActivity = day => Boolean(day && (day.habits.length || day.games.length || validMood(day.mood)));
function save(day){
  days[today] = day;
  try {localStorage.setItem(storageKey,JSON.stringify(days)); return true;}
  catch {return false;}
}
function announce(text, saved = true){announcement.textContent = text + (saved ? '' : ' Сохранение на устройстве недоступно.');}
function shuffle(items){
  const result = [...items];
  for(let index=result.length-1;index>0;index--){
    const other = Math.floor(Math.random()*(index+1));
    [result[index],result[other]] = [result[other],result[index]];
  }
  return result;
}
function gameCards(){
  return `<div class="game-grid">${Object.entries(games).map(([id,game]) => `<button class="game-card" data-action="play" data-value="${id}"><span class="game-art ${game.color}" aria-hidden="true"><span class="game-symbol">${game.icon}</span></span><span class="game-body"><span class="game-meta">${game.type} · ${game.time}</span><span class="game-title">${game.name}</span><span class="game-desc">${game.desc}</span></span></button>`).join('')}</div>`;
}
function home(){
  const day = selectedDay();
  return `<section class="hero" aria-labelledby="screen-heading"><div class="hero-copy"><p class="eyebrow">Твоя ежедневная забота</p><h1 id="screen-heading" tabindex="-1">Здоровье в твоём ритме</h1><p>Играй, пробуй полезные привычки и отмечай, как ты себя чувствуешь.</p><button class="primary" data-action="play" data-value="quiz">Играть в «Миф или факт»</button></div><div class="hero-illustration" aria-hidden="true"><div class="orbit"></div><div class="leaf"></div><div class="kit"></div><span class="spark a">✧</span><span class="spark b">✦</span><span class="spark c">✧</span></div></section>
  <section class="section" aria-labelledby="today-heading"><div class="section-header"><h2 id="today-heading">Мой день</h2><time class="date" datetime="${today}">${dateFormat.format(new Date())}</time></div><div class="columns">
  <div class="panel"><div class="panel-heading"><h3>Привычки</h3><strong>${day.habits.length} из ${habits.length}</strong></div><div class="meter" aria-hidden="true"><div style="width:${100 * day.habits.length / habits.length}%"></div></div>${habits.map(habit => `<button class="habit" aria-pressed="${day.habits.includes(habit.id)}" data-action="habit" data-value="${habit.id}"><span class="habit-icon ${habit.color}" aria-hidden="true">${habit.icon}</span><span class="habit-label">${habit.name}</span><span class="check" aria-hidden="true">${day.habits.includes(habit.id) ? '✓' : ''}</span></button>`).join('')}</div>
  <div class="panel mood"><h3>Как ты сегодня?</h3><p>Отметь своё самочувствие.</p><div class="mood-buttons" role="group" aria-label="Самочувствие">${moods.map(([icon,label],index) => `<button class="mood-button" aria-label="${label}" title="${label}" aria-pressed="${day.mood === index}" data-action="mood" data-value="${index}">${icon}</button>`).join('')}</div><div class="mood-status">${validMood(day.mood) ? moods[day.mood][1] : ''}</div></div></div></section>
  <section class="section" aria-labelledby="games-heading"><div class="section-header"><h2 id="games-heading">Мини-игры</h2></div>${gameCards()}</section>`;
}
function progress(){
  const now = new Date();
  const activity = Object.entries(days).filter(([,day]) => hasActivity(day));
  const activeKeys = new Set(activity.map(([key]) => key));
  const start = activeKeys.has(today) ? now : shiftedDate(-1,now);
  const sorted = activity.sort(([a],[b]) => b.localeCompare(a));
  let streak = 0;
  while (activeKeys.has(localKey(shiftedDate(-streak,start)))) streak++;
  const weeks = Array.from({length:7},(_,index) => shiftedDate(index-6,now));
  return `<div class="screen-title"><h1 id="screen-heading" tabindex="-1">Мой прогресс</h1><p>История привычек, игр и самочувствия на этом устройстве.</p></div>
  <div class="stats"><div class="panel stat"><strong>${totalPoints()}</strong><span>очки заботы</span></div><div class="panel stat"><strong>${streak}</strong><span>${word(streak,['день','дня','дней'])} подряд</span></div><div class="panel stat"><strong>${activity.length}</strong><span>${word(activity.length,['активный день','активных дня','активных дней'])}</span></div></div>
  <section class="panel"><div class="panel-heading"><h3>Последние 7 дней</h3></div><div class="week">${weeks.map(date => {const day=days[localKey(date)]; const current=ordinal(date)===ordinal(now); return `<div class="day" data-active="${hasActivity(day)}" ${current ? 'aria-current="date"' : ''}><span>${weekdayFormat.format(date)}</span><span class="day-mark" aria-label="${dateFormat.format(date)}${hasActivity(day) ? ', активность есть' : ''}">${date.getDate()}</span></div>`;}).join('')}</div></section>
  <section class="panel section"><div class="panel-heading"><h3>Недавние отметки</h3></div>${sorted.length ? `<div class="history">${sorted.slice(0,14).map(([key,day]) => {const date=new Date(key+'T12:00:00');return `<div class="history-row"><time datetime="${key}">${dateFormat.format(date)}</time><span>${day.habits.length} из ${habits.length} привычек · ${day.games.length} ${word(day.games.length,['игра','игры','игр'])}${validMood(day.mood) ? ` · <span title="${moods[day.mood][1]}" aria-label="${moods[day.mood][1]}">${moods[day.mood][0]}</span>` : ''}</span></div>`;}).join('')}</div>` : `<p class="empty">Здесь появятся твои отметки. Начни с привычки или сыграй в мини-игру.</p><button class="link-button" data-action="nav" data-value="home">Перейти к привычкам</button>`}</section>`;
}
const actions = (label,value,action,style='primary') => `<button class="${style}" data-action="${action}" data-value="${value}">${label}</button>`;
function quizView(){
  const [question,correct,explanation] = run.questions[run.index];
  const answered = run.answer !== null;
  return `<p>Вопрос ${run.index + 1} из ${run.questions.length}</p><h2 id="turn-heading" tabindex="-1">${question}</h2><div class="answers">${['Факт','Миф'].map((label,index) => `<button class="choice" data-action="answer" data-value="${index}" ${answered ? 'disabled' : ''} ${answered && (index === correct || index === run.answer) ? `data-result="${index === correct ? 'correct' : 'wrong'}"` : ''}>${label}</button>`).join('')}</div>${answered ? `<div class="feedback" role="status"><strong>${run.answer === correct ? 'Верно!' : 'Попробуй запомнить.'}</strong> ${explanation}</div><div class="game-actions">${actions(run.index === run.questions.length - 1 ? 'Показать результат' : 'Следующий вопрос','','quiz-next')}</div>` : ''}`;
}
function pairsView(){
  return `<h2 id="turn-heading" tabindex="-1">Найди подходящие пары</h2><p>Открывай по две карточки. Подбери к каждой привычке подходящее действие.</p><div class="tiles">${run.cards.map((card,index) => {const matched=run.matched.includes(card.pair);const visible=matched || run.open.includes(index);return `<button class="tile" data-action="flip" data-value="${index}" aria-label="${visible ? card.label : `Открыть карточку ${index+1}`}" aria-pressed="${visible}" data-matched="${matched}" ${matched ? 'disabled' : ''}>${visible ? `<span aria-hidden="true">${card.icon}</span>${card.label}` : '<span aria-hidden="true">✦</span>'}</button>`;}).join('')}</div><div class="feedback" role="status">${run.message || `Найдено пар: ${run.matched.length} из ${run.cards.length / 2}`}</div>`;
}
function routineView(){
  return `<h2 id="turn-heading" tabindex="-1">Собери день: от утра до вечера</h2><p>Выбирай по одному действию в том порядке, в каком они происходят.</p>${run.placed ? `<ol class="routine">${run.sequence.slice(0,run.placed).map(text => `<li>${text}</li>`).join('')}</ol>` : ''}<div class="answers">${run.choices.filter(index => index >= run.placed).map(index => `<button class="choice" data-action="order" data-value="${index}" ${run.wrong === index ? 'data-result="wrong"' : ''}>${run.sequence[index]}</button>`).join('')}</div>${run.wrong !== null ? '<div class="feedback" role="status">Это действие происходит позже. Выбери шаг, который идёт раньше.</div>' : ''}`;
}
function gameScreen(){
  const detail = run.id === 'quiz' ? `Верных ответов: ${run.score} из ${run.questions.length}.` : run.id === 'pairs' ? `Ты нашёл все пары за ${run.turns} ${word(run.turns,['попытку','попытки','попыток'])}.` : 'Все четыре действия на своих местах.';
  return `<div class="screen-title"><button class="link-button" data-action="nav" data-value="games">Все игры</button><h1 id="screen-heading" tabindex="-1">${games[run.id].name}</h1></div><section class="panel game-panel">${run.done ? `<h2 id="turn-heading" tabindex="-1">Игра пройдена</h2><p>${detail} ${run.reward ? '+10 очков заботы.' : 'Сегодня ты уже получил очки за эту игру.'}${run.saved ? '' : ' Сохранение на устройстве недоступно.'}</p><div class="game-actions">${actions('Играть ещё',run.id,'play')}${actions('К привычкам','home','nav','secondary')}</div>` : run.id === 'quiz' ? quizView() : run.id === 'pairs' ? pairsView() : routineView()}</section>`;
}
function render(focus){
  today = localKey();
  const points = totalPoints();
  document.querySelector('#points').textContent = `${points} ${word(points,['очко','очка','очков'])}`;
  document.querySelectorAll('.tab').forEach(tab => {
    if (tab.dataset.value === (screen === 'game' ? 'games' : screen)) tab.setAttribute('aria-current','page');
    else tab.removeAttribute('aria-current');
  });
  page.innerHTML = screen === 'home' ? home() : screen === 'progress' ? progress() : screen === 'game' ? gameScreen() : `<div class="screen-title"><h1 id="screen-heading" tabindex="-1">Мини-игры</h1><p>За первое прохождение каждой игры за день — 10 очков заботы.</p></div>${gameCards()}`;
  const app = telegramReady && activeTelegram();
  if (screen === 'game') app?.BackButton?.show();
  else app?.BackButton?.hide();
  if (focus) page.querySelector(focus)?.focus({preventScroll:true});
}
function navigate(next){
  clearTimeout(pairTimer);
  run = null;
  screen = next;
  render('#screen-heading');
  window.scrollTo(0,0);
}
function play(id){
  clearTimeout(pairTimer);
  const old = run;
  run = {id,done:false};
  if (id === 'quiz') Object.assign(run,{questions:shuffle(questions),index:0,answer:null,score:0});
  if (id === 'pairs') {
    const cards = shuffle(pairs).slice(0,3).flatMap((items,pair) => items.map(([icon,label]) => ({pair,icon,label})));
    Object.assign(run,{cards:shuffle(cards),matched:[],open:[],turns:0,message:''});
  }
  if (id === 'routine') {
    const sequence=shuffle(routines.filter(sequence => sequence !== old?.sequence))[0];
    Object.assign(run,{sequence,choices:shuffle([0,1,2,3]),placed:0,wrong:null});
  }
  screen = 'game';
  render('#screen-heading');
  window.scrollTo(0,0);
}
function finish(){
  const day = selectedDay();
  run.reward = !day.games.includes(run.id);
  if (run.reward) day.games.push(run.id);
  run.saved = !run.reward || save(day);
  run.done = true;
  render('#turn-heading');
}
function flip(index){
  if (run.open.length === 2 || run.open.includes(index) || run.matched.includes(run.cards[index].pair)) return;
  const focus = `[data-action="flip"][data-value="${index}"]`;
  run.open.push(index);
  run.message = '';
  if (run.open.length === 1) {render(focus);return;}
  run.turns++;
  const [first,second] = run.open.map(item => run.cards[item]);
  if (first.pair === second.pair) {
    run.matched.push(first.pair);
    run.open = [];
    if (run.matched.length === run.cards.length / 2) {finish();return;}
    run.message = `Пара найдена! ${run.matched.length} из ${run.cards.length / 2}.`;
    render('.tile:not(:disabled)');
  } else {
    run.message = 'Разные карточки. Попробуй ещё раз.';
    render(focus);
    pairTimer = setTimeout(() => {
      const active = document.activeElement?.matches('.tile') ? document.activeElement.dataset.value : null;
      run.open = [];
      render(active === null ? undefined : `[data-action="flip"][data-value="${active}"]`);
    },850);
  }
}
document.addEventListener('click',event => {
  const button = event.target.closest('button[data-action]');
  if (!button || button.disabled) return;
  const {action,value} = button.dataset;
  const index = Number(value);
  today = localKey();
  if (action === 'nav') {navigate(value);return;}
  if (action === 'play') {play(value);return;}
  if (action === 'habit' || action === 'mood') {
    const day = selectedDay();
    let message;
    if (action === 'habit') {
      const checked = day.habits.includes(value);
      day.habits = checked ? day.habits.filter(id => id !== value) : [...day.habits,value];
      message = checked ? 'Отметка о привычке снята.' : 'Привычка отмечена. Пять очков заботы.';
    } else {
      day.mood = day.mood === index ? null : index;
      message = day.mood === null ? 'Отметка о самочувствии снята.' : `Самочувствие отмечено: ${moods[index][1]}.`;
    }
    const saved = save(day);
    render(`[data-action="${action}"][data-value="${value}"]`);
    announce(message,saved);
    return;
  }
  if (!run || run.done) return;
  if (action === 'answer' && run.answer === null) {
    run.answer = index;
    if (index === run.questions[run.index][1]) run.score++;
    render('[data-action="quiz-next"]');
  }
  if (action === 'quiz-next' && run.answer !== null) {
    if (run.index === run.questions.length-1) {finish();return;}
    run.index++;
    run.answer = null;
    render('#turn-heading');
  }
  if (action === 'flip') flip(index);
  if (action === 'order') {
    if (index === run.placed) {
      run.placed++;
      run.wrong = null;
      if (run.placed === run.sequence.length) {finish();return;}
      render('.choice');
    } else {
      run.wrong = index;
      render(`[data-action="order"][data-value="${index}"]`);
    }
  }
});
function initTelegram(){
  const app = activeTelegram();
  if (!app?.initData || telegramReady) return;
  telegramReady = true;
  app.ready();
  app.expand();
  app.BackButton?.onClick(() => navigate('games'));
  if (screen === 'game') app.BackButton?.show();
}
function refresh(){
  if (today !== localKey() && screen !== 'game') render();
}
render();
document.addEventListener('DOMContentLoaded',initTelegram);
document.addEventListener('visibilitychange',refresh);
window.addEventListener('storage',event => {
  if (event.key === storageKey || event.key === null) {
    days = loadDays();
    if (screen !== 'game') render();
  }
});
setInterval(refresh,30000);
</script>
</body>
</html>
